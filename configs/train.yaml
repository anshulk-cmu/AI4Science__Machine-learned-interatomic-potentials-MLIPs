defaults:
  - variant: dense
  - data: generic
  - element_refs: omol
  - logger: wandb
  - _self_

job:
  device_type: CUDA
  run_name: omol_dense
  run_dir: ${oc.env:OMOL_RUN_DIR,../omol25-runs}
  seed: 0
  debug: false
  scheduler:
    mode: LOCAL
    ranks_per_node: 1
    num_nodes: 1
    distributed_init_method: FILE

training:
  steps: 100
  warmup_steps: null  # null = round(0.05 * steps), see training/schedulers.py
  eval_every: ${training.steps}
  ckpt_every: ${training.steps}
  max_atoms: 450  # atoms per batch, the same for every variant; needs a GPU with 32 GB
  max_neighbors: 300
  cutoff: 6.0
  workers: 0
  # One normalizer for both tasks. 1.433569 is the official allscaip omol_4m value
  # (configs/allscaip/omol_4m.yml, fairchem_core-2.21.0), the closest official analogue.
  # Refit it on train_4M before a full run.
  normalizer_rmsd: 1.433569

# OMol tasks
tasks:
  - _target_: fairchem.core.units.mlip_unit.mlip_unit.Task
    name: omol_energy
    level: system
    property: energy
    out_spec: {_target_: fairchem.core.units.mlip_unit.mlip_unit.OutputSpec, dim: [1], dtype: float32}
    datasets: [omol]
    normalizer: {_target_: fairchem.core.modules.normalization.normalizer.Normalizer, mean: 0.0, rmsd: '${training.normalizer_rmsd}'}
    element_references:
      _target_: fairchem.core.modules.normalization.element_references.ElementReferences
      element_references:
        # float64 because the references are thousands of eV, as in the official OMol tasks
        _target_: torch.DoubleTensor
        _args_:
          - ${element_refs.omol_elem_refs}
    loss_fn:
      _target_: fairchem.core.modules.loss.DDPMTLoss
      loss_fn: {_target_: fairchem.core.modules.loss.PerAtomMAELoss}
      reduction: mean
      coefficient: 1.0
    metrics: [mae, per_atom_mae]
    train_on_free_atoms: false
    eval_on_free_atoms: false
  - _target_: fairchem.core.units.mlip_unit.mlip_unit.Task
    name: omol_forces
    level: atom
    property: forces
    out_spec: {_target_: fairchem.core.units.mlip_unit.mlip_unit.OutputSpec, dim: [3], dtype: float32}
    datasets: [omol]
    normalizer: {_target_: fairchem.core.modules.normalization.normalizer.Normalizer, mean: 0.0, rmsd: '${training.normalizer_rmsd}'}
    element_references: null
    loss_fn:
      _target_: fairchem.core.modules.loss.DDPMTLoss
      loss_fn: {_target_: fairchem.core.modules.loss.L2NormLoss}
      reduction: mean
      coefficient: 1.0
    metrics: [mae]
    train_on_free_atoms: false
    eval_on_free_atoms: false

runner:
  _target_: fairchem.core.components.train.train_runner.TrainEvalRunner
  train_dataloader: ${train_dataloader}
  eval_dataloader: ${eval_dataloader}
  max_epochs: null
  max_steps: ${training.steps}
  evaluate_every_n_steps: ${training.eval_every}
  train_eval_unit:
    _target_: training.guarded_unit.GuardedTrainEvalUnit
    gc_every: 50                  # collect garbage and empty the CUDA cache every 50 steps
    max_consecutive_oom: 5        # an out-of-memory batch is skipped; this many in a row stops the run
    job_config: ${job}
    model: ${variant}
    tasks: ${tasks}
    optimizer_fn:
      _target_: torch.optim.AdamW
      _partial_: true
      lr: 0.0002
      weight_decay: 0.001
    cosine_lr_scheduler_fn:
      _target_: training.schedulers.cosine_with_warmup
      _partial_: true
      warmup_steps: ${training.warmup_steps}
      warmup_factor: 0.2
      lr_min_factor: 0.01
      steps: ${training.steps}
    bf16: false
    print_every: 1
    clip_grad_norm: 10.0
    ema_decay: 0.999
    save_inference_ckpt: true
  callbacks:
    - _target_: fairchem.core.components.train.train_runner.TrainCheckpointCallback
      checkpoint_every_n_steps: ${training.ckpt_every}
      max_saved_checkpoints: 3
