defaults:
  - variant: dense
  - data: generic
  - _self_

job:
  device_type: CUDA
  run_name: omol_dense
  run_dir: ${oc.env:OMOL_RUN_DIR,../omol25-runs}
  seed: 0
  debug: false
  logger: null
  scheduler:
    mode: LOCAL
    ranks_per_node: 1
    num_nodes: 1
    distributed_init_method: FILE

training:
  steps: 100
  max_atoms: 320
  cutoff: 6.0
  workers: 0

# OMol tasks
tasks:
  - _target_: fairchem.core.units.mlip_unit.mlip_unit.Task
    name: omol_energy
    level: system
    property: energy
    out_spec: {_target_: fairchem.core.units.mlip_unit.mlip_unit.OutputSpec, dim: [1], dtype: float32}
    datasets: [omol]
    normalizer: {_target_: fairchem.core.modules.normalization.normalizer.Normalizer, mean: 0.0, rmsd: 1.0}
    element_references: null
    loss_fn:
      _target_: fairchem.core.modules.loss.DDPMTLoss
      loss_fn: {_target_: fairchem.core.modules.loss.PerAtomMAELoss}
      reduction: mean
      coefficient: 1.0
    metrics: [mae, per_atom_mae]
    train_on_free_atoms: false
    eval_on_free_atoms: false
  - _target_: fairchem.core.units.mlip_unit.mlip_unit.Task
    name: omol_forces
    level: atom
    property: forces
    out_spec: {_target_: fairchem.core.units.mlip_unit.mlip_unit.OutputSpec, dim: [3], dtype: float32}
    datasets: [omol]
    normalizer: {_target_: fairchem.core.modules.normalization.normalizer.Normalizer, mean: 0.0, rmsd: 1.0}
    element_references: null
    loss_fn:
      _target_: fairchem.core.modules.loss.DDPMTLoss
      loss_fn: {_target_: fairchem.core.modules.loss.L2NormLoss}
      reduction: mean
      coefficient: 1.0
    metrics: [mae]
    train_on_free_atoms: false
    eval_on_free_atoms: false

runner:
  _target_: fairchem.core.components.train.train_runner.TrainEvalRunner
  train_dataloader: ${train_dataloader}
  eval_dataloader: ${eval_dataloader}
  max_epochs: null
  max_steps: ${training.steps}
  evaluate_every_n_steps: ${training.steps}
  train_eval_unit:
    _target_: fairchem.core.units.mlip_unit.mlip_unit.MLIPTrainEvalUnit
    job_config: ${job}
    model: ${variant}
    tasks: ${tasks}
    optimizer_fn:
      _target_: torch.optim.AdamW
      _partial_: true
      lr: 0.0002
      weight_decay: 0.001
    cosine_lr_scheduler_fn:
      _target_: fairchem.core.units.mlip_unit.mlip_unit._get_consine_lr_scheduler
      _partial_: true
      warmup_factor: 0.2
      warmup_epochs: 0.05
      lr_min_factor: 0.01
      epochs: null
      steps: ${training.steps}
    bf16: false
    print_every: 1
    clip_grad_norm: 10.0
    ema_decay: null
    save_inference_ckpt: false
  callbacks:
    - _target_: fairchem.core.components.train.train_runner.TrainCheckpointCallback
      checkpoint_every_n_steps: ${training.steps}
      max_saved_checkpoints: 3
