# @package _global_
# Full OMol-compatible ASE DB splits, using FairChem's native dataset stack.
data:
  root: ${oc.env:OMOL_DATA_ROOT,../omol25-data}  # Relative paths resolve from the repository root
  train_src: ${data.root}/train_4M  # Directory of train data
  val_src: ${data.root}/val  # Directory of val data

train_dataset:
  _target_: fairchem.core.datasets.mt_concat_dataset.create_concat_dataset
  dataset_configs:
    omol:
      splits:
        train:
          src: ${data.train_src}
          sample_n: 64  # Number of samples to include, null = use the full training split
          # A fixed list of rows instead of a random draw: set sample_n=null, no_shuffle=true, metadata_path to an npz with an
          # integer field 'index', and subset_to to [{metadata_key: index, op: in, rhv: <text file, one row per line>}]
          metadata_path: null
          subset_to: []
          no_shuffle: null
      format: ase_db
      a2g_args:
        molecule_cell_size: 120.0
        r_energy: true
        r_forces: true
        r_stress: false
        r_data_keys: [spin, charge]
        r_edges: true
        radius: ${training.cutoff}
        max_neigh: ${training.max_neighbors}
      key_mapping:
        energy: omol_energy
        forces: omol_forces
      transforms:
        common_transform:
          dataset_name: omol
  combined_dataset_config:
    sampling: {type: temperature, temperature: 1.0}

val_dataset:
  _target_: fairchem.core.datasets.mt_concat_dataset.create_concat_dataset
  dataset_configs:
    omol:
      splits:
        val:
          src: ${data.val_src}
          sample_n: 64  # Number of samples, null = use the full validation split
          metadata_path: null  # see the train split above for the fixed-list settings
          subset_to: []
          no_shuffle: null
      format: ase_db
      a2g_args:
        molecule_cell_size: 120.0
        r_energy: true
        r_forces: true
        r_stress: false
        r_data_keys: [spin, charge]
        r_edges: true
        radius: ${training.cutoff}
        max_neigh: ${training.max_neighbors}
      key_mapping:
        energy: omol_energy
        forces: omol_forces
      transforms:
        common_transform:
          dataset_name: omol
  combined_dataset_config:
    sampling: {type: temperature, temperature: 1.0}

train_dataloader:
  _target_: fairchem.core.components.common.dataloader_builder.get_dataloader
  dataset: ${train_dataset}
  batch_sampler_fn:
    _target_: fairchem.core.datasets.samplers.max_atom_distributed_sampler.MaxAtomDistributedBatchSampler
    _partial_: true
    max_atoms: ${training.max_atoms}
    seed: ${job.seed}
    shuffle: true
    drop_last: false
  num_workers: ${training.workers}
  collate_fn:
    _target_: fairchem.core.units.mlip_unit.mlip_unit.mt_collater_adapter
    tasks: ${tasks}

eval_dataloader:
  _target_: fairchem.core.components.common.dataloader_builder.get_dataloader
  dataset: ${val_dataset}
  batch_sampler_fn:
    _target_: fairchem.core.datasets.samplers.max_atom_distributed_sampler.MaxAtomDistributedBatchSampler
    _partial_: true
    max_atoms: ${training.max_atoms}
    seed: ${job.seed}
    shuffle: false
    drop_last: false
  num_workers: ${training.workers}
  collate_fn:
    _target_: fairchem.core.units.mlip_unit.mlip_unit.mt_collater_adapter
    tasks: ${tasks}
